<title>Activitățile mele</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: meniu fix în stânga | activitățile zilei pe o linie de timp | calendar, cifre, probleme și observații în dreapta.
   Pe telefon: totul într-o coloană, meniul devine un rând de butoane care rămâne sus. */
/* Doar dark, fundal negru pentru toate temele; tema (data-palette pe <html>) schimbă doar culoarea butoanelor */
:root{
  color-scheme:dark;
  --bg:#000000; --surface:#0E0E10; --ink:#EDEDEF; --muted:#9B9BA1; --line:#26262B; --soft:#18181B;
  --accent:#E0915E; --accent-ink:#1A120C;
  --doing:#E8B84F; --doing-bg:#2E2512; --done:#7FC79A; --done-bg:#14271C; --late:#F07A6A; --late-bg:#311815;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
/* Roșu (implicit): roșu aprins pe negru, cu o tentă vișinie sus */
:root[data-palette="rosu"]{ --accent:#E5132E; --accent-ink:#FFFFFF; }
:root[data-palette="rosu"] .side{background:linear-gradient(180deg,#3B0509 0%,#1A0204 34%,var(--surface) 68%)}
/* Noapte: lavandă */
:root[data-palette="noapte"]{ --accent:#B6A2FF; --accent-ink:#17112E; }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.foot{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px}
.swatches{display:flex;gap:8px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0;position:relative;overflow:hidden}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.sw span{position:absolute;inset:0}
.backup{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* ---- schelet ---- */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;padding-inline:20px;padding-block:20px;max-width:1560px;margin:0 auto;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.side{position:sticky;top:calc(20px + env(safe-area-inset-top,0px));height:calc(100vh - 40px);display:flex;flex-direction:column;gap:4px;padding:16px 12px;overflow-y:auto;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 20%,#000) 0%,var(--surface) 55%)}
.brand{font:700 20px/1.15 var(--f-display);padding:4px 10px 14px;display:flex;gap:10px;align-items:center}
.brand i{width:11px;height:11px;border-radius:3px;background:var(--accent);flex:none}
.search{padding:0 4px 10px}
.search input{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:rgba(0,0,0,.4);color:var(--ink);font-size:14px}
.search input::placeholder{color:var(--muted)}
.navlist{display:flex;flex-direction:column;gap:2px}
.grp{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:#C9C9CE;border:0;background:transparent;font:500 14.5px var(--f-body);text-align:left;width:100%}
.nav:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.nav svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.nav .n{margin-left:auto;font:500 11px var(--f-mono);background:var(--soft);color:var(--muted);padding:1px 7px;border-radius:99px}
.nav .n:empty{display:none}
.nav[aria-current="page"] .n{background:rgba(0,0,0,.25);color:inherit}
.sfoot{margin-top:auto;border-top:1px solid var(--line);padding:12px 6px 0;display:flex;flex-direction:column;gap:10px}
.sfoot .swatches{gap:8px}
.sfoot .sw{width:24px;height:24px}
.sfoot .acct{padding:0;margin:0;max-width:none;flex-direction:column;align-items:flex-start;gap:6px;font-size:12.5px}
.content{min-width:0}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.maincol{display:flex;flex-direction:column;gap:16px;min-width:0;padding-bottom:48px}
.rcol{display:flex;flex-direction:column;gap:14px;min-width:0;position:sticky;top:calc(20px + env(safe-area-inset-top,0px))}
.rcol .box{padding:14px}
.rcol section.box{gap:10px}
.rcol .sec-head{border-bottom:0;padding-bottom:0}
.rcol h2,.box h3{font:600 16px var(--f-display);margin:0}
.box h3{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.box h3 span{font:500 11px var(--f-mono);color:var(--muted)}
.rcol .addrow input[type=text]{background:#000;font-size:14px;padding:8px 10px}
.rcol .addrow .ghost{padding:7px 10px;font-size:13px}
.rcol .issue{background:#000}
/* calendar */
.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:500}
.calnav .icon-btn{min-width:28px;height:28px;padding:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font:12.5px var(--f-mono);font-variant-numeric:tabular-nums}
.cal .h{color:var(--muted);font-size:11px;padding-bottom:4px}
.cal button{border:1px solid transparent;background:transparent;color:var(--ink);padding:5px 0 8px;border-radius:7px;position:relative;font:inherit}
.cal button:hover{border-color:var(--line)}
.cal button.o{color:#4a4a50}
.cal button.we{color:var(--muted)}
.cal button.sel{border-color:var(--ink)}
.cal button.tdy{background:var(--accent);color:var(--accent-ink);font-weight:600}
.cal button[data-s]::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;border-radius:50%;transform:translateX(-50%)}
.cal button[data-s="done"]::after{background:var(--done)}
.cal button[data-s="plan"]::after{background:var(--doing)}
.cal button[data-s="late"]::after{background:var(--late)}
.cal button.tdy::after{background:var(--accent-ink)!important}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
/* pe scurt */
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:var(--soft);border-radius:9px;padding:8px 10px}
.k small{display:block;color:var(--muted);font-size:11.5px}
.k b{font:600 21px var(--f-display);font-variant-numeric:tabular-nums}
.k.g b{color:var(--done)}.k.r b{color:var(--late)}.k.a b{color:var(--doing)}
.pbar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin:12px 0 5px}
.pbar i{display:block;height:100%;background:var(--done);border-radius:99px}
/* compunere */
.composer{padding:12px;display:flex;flex-direction:column;gap:10px}
.composer .addrow input[type=text]{background:#000}
.crow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:13px;color:#C9C9CE;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--muted);color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.chip input[type=date]{border:0;background:transparent;color:inherit;font:inherit;padding:0;color-scheme:dark}
.crow .primary{margin-left:auto}
/* linie de timp */
.tl{display:flex;flex-direction:column;gap:20px}
.tl>section{position:relative;padding-left:28px}
.tl>section::before{content:"";position:absolute;left:9px;top:14px;bottom:-20px;width:2px;background:var(--line)}
.tl>section:last-child::before{bottom:0}
.tl .sec-head{position:relative;border-bottom:0;padding-bottom:2px}
.tl .sec-head::before{content:"";position:absolute;left:-25px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
.tl .sec-late .sec-head::before{background:var(--late)}
.tl .task{position:relative}
.tl .task::before{content:"";position:absolute;left:-23px;top:19px;width:8px;height:8px;border-radius:50%;background:#3a3a40;box-shadow:0 0 0 4px var(--bg)}
.tl .task.st-todo::before{background:var(--late)}.tl .task.st-doing::before{background:var(--doing)}.tl .task.st-done::before{background:var(--done)}
.tl .task.dragging::before{display:none}
/* căutare */
.sres{display:flex;flex-direction:column;gap:6px}
.sres button{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit}
.sres button:hover{border-color:var(--muted)}
.sres .sd{font:12px var(--f-mono);color:var(--muted);flex:none;width:92px}
.sres .st{flex:1;min-width:0;overflow-wrap:anywhere}
.sres .st small{display:block;color:var(--muted);font-size:12.5px}
.sres mark{background:color-mix(in srgb,var(--accent) 35%,transparent);color:inherit;border-radius:3px}
.sres i{width:8px;height:8px;border-radius:50%;flex:none}
.top .daynav .primary{margin-left:6px}
.foot:has(#backup[hidden]){display:none}
/* finalizate */
.dgrp{font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between}
.dlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ditem{background:var(--done-bg);border:1px solid color-mix(in srgb,var(--done) 45%,transparent);border-radius:10px;padding:10px 12px;display:flex;gap:12px;align-items:flex-start}
.ditem .ck{color:var(--done);flex:none;margin-top:2px}
.ditem .dm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ditem .dt{overflow-wrap:anywhere}
.ditem .da{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.ditem .tag{background:rgba(0,0,0,.35)}
@media (max-width:560px){.ditem{flex-wrap:wrap}.ditem .da{width:100%;justify-content:flex-start;padding-left:26px}}
.content .bt{margin-inline:0;padding-inline:0;padding-block:4px 120px;max-width:1000px}
@media (max-width:859px){.content .bt{padding-block:0 120px}}
@media (max-width:1179px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .rcol{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:start}
}
@media (max-width:859px){
  .shell{display:flex;flex-direction:column;align-items:stretch;gap:14px;padding-inline:16px;padding-block:12px}
  .shell>*,.navlist,.search,.brand,.sfoot{min-width:0}
  .side{display:contents}
  .brand{order:0;padding:4px 2px 0;font-size:22px}
  .search{order:2;padding:0}
  .navlist{order:1;position:sticky;top:env(safe-area-inset-top,0px);z-index:8;flex-direction:row;overflow-x:auto;gap:6px;padding-block:8px;margin-inline:-16px;padding-inline:16px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
  .navlist::-webkit-scrollbar{display:none}
  .navlist .grp{display:none}
  .nav{width:auto;flex:none;border:1px solid var(--line);background:var(--surface);padding:8px 12px;white-space:nowrap}
  .nav svg{width:15px;height:15px}
  .content{order:3}
  .sfoot{order:4;border-top:1px solid var(--line);padding:14px 2px 24px;margin-top:0}
  .rcol{grid-template-columns:minmax(0,1fr)}
  .tl>section{padding-left:22px}
  .tl>section::before{left:6px}
  .tl .sec-head::before{left:-21px}
  .tl .task::before{left:-19px}
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* antet */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,34px);line-height:1.1;margin:2px 0 0;text-wrap:balance}
.daynav{display:flex;gap:6px;align-items:center}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:36px;height:36px;padding:0 10px}
.icon-btn:hover{border-color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px;width:fit-content}
.tab{border:0;background:transparent;padding:6px 14px;border-radius:7px;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.stats{display:flex;flex-wrap:wrap;gap:8px;font-family:var(--f-mono);font-size:13px}
.stat{padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{font-weight:500;color:var(--ink)}
.stat.done b{color:var(--done)} .stat.doing b{color:var(--doing)} .stat.late b{color:var(--late)}

.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:9px 16px;font-weight:600}
.primary:hover{filter:brightness(1.07)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:500}
.ghost:hover{border-color:var(--muted)}

.addrow{display:flex;gap:8px}
.addrow input[type=text]{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px}
.addrow input::placeholder{color:var(--muted)}

/* secțiuni */
section{display:flex;flex-direction:column;gap:8px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0}
.sec-head .count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sec-late h2{color:var(--late)}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}

.task{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.task.is-late{border-left:3px solid var(--late)}
.task.st-todo{background:var(--late-bg);border-color:var(--late)}
.task.st-doing{background:var(--doing-bg);border-color:var(--doing)}
.task.st-done{background:var(--done-bg);border-color:var(--done)}
.task.st-todo .seg,.task.st-doing .seg,.task.st-done .seg{background:rgba(0,0,0,.35);border-color:transparent}
.task .main{min-width:0;display:flex;flex-direction:column;gap:3px}
.task .title{overflow-wrap:anywhere;cursor:text}
.task.st-done .title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:5px;background:var(--soft);color:var(--muted)}
.tag.late{background:var(--late-bg);color:var(--late)}
.title-edit{width:100%;border:1px solid var(--accent);border-radius:6px;padding:4px 6px;background:var(--surface)}
.task.has-move{grid-template-columns:auto 1fr auto}
.grip{align-self:stretch;width:22px;border:0;background:transparent;color:var(--muted);cursor:grab;font-size:15px;letter-spacing:-3px;padding:0;touch-action:none;border-radius:6px}
.grip:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.task[data-list]{cursor:grab}
.task[data-list] button,.task[data-list] input,.task[data-list] textarea,.task[data-list] .title{cursor:pointer}
.task[data-list] .title{cursor:text}
.task.dragging{position:relative;z-index:5;cursor:grabbing;box-shadow:0 10px 28px rgba(0,0,0,.6);opacity:.96}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.note{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;border-left:2px solid var(--line);padding-left:8px;margin-top:2px}
.mini.has-note{color:var(--accent)}
.pinbtn{display:inline-flex;align-items:center;gap:4px}
.pinbtn.on{color:var(--accent)}
.pin-flag{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.note-box{grid-column:1/-1;display:flex;gap:8px;align-items:flex-end;padding-top:6px;border-top:1px dashed var(--line)}
.note-box textarea{flex:1;min-width:0;resize:vertical;border:1px solid var(--accent);border-radius:8px;padding:8px 10px;background:var(--surface);font:inherit;font-size:14px;color:var(--ink)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--soft)}
.seg button{border:0;background:transparent;padding:5px 9px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].s-todo{background:var(--late-bg);color:var(--late);font-weight:600}
.seg button[aria-pressed="true"].s-doing{background:var(--doing-bg);color:var(--doing);font-weight:600}
.seg button[aria-pressed="true"].s-done{background:var(--done-bg);color:var(--done);font-weight:600}
.actions{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.mini{border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 8px;font-size:12.5px;color:var(--muted)}
.mini:hover{border-color:var(--line);color:var(--ink)}
.postpone{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:6px;border-top:1px dashed var(--line);font-size:13px}
.postpone input[type=date]{border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:var(--surface)}
@media (max-width:560px){.task,.task.has-move{grid-template-columns:auto 1fr}.task:not(.has-move) .main{grid-column:1/-1}.actions{grid-column:1/-1;justify-content:flex-start}}

.issue{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;display:flex;gap:10px;align-items:flex-start}
.issue .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.issue.res .txt{color:var(--muted);text-decoration:line-through}

/* recurente */
.rec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.rec .name{flex:1 1 200px;min-width:0;overflow-wrap:anywhere;font-weight:500}
.days{display:flex;gap:4px;flex-wrap:wrap}
.day{width:34px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.hint{font-size:13px;color:var(--muted)}

/* rezumat */
.summary{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.summary pre{margin:0;white-space:pre-wrap;font-family:var(--f-body);font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;display:flex;gap:12px;align-items:center;font-size:14px;max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:var(--bg);font-weight:600;text-decoration:underline}
.sync{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.task,.issue{transition:border-color .15s}}
/* Comutator între cele două aplicații + jurnalul de pariuri (prefix bt-), pe aceleași culori dark ale jurnalului */
:root{ --cash:#7FB0E8; --cash-bg:#132235; }
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);border-bottom:1px solid var(--line)}
.appbar-in{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px}

<script>
/* ---------- GitHub Pages: sincronizare prin Firebase ----------
   Rulează doar pe *.github.io. Oferă aceeași interfață ca window.claude (use("db"), use("user")),
   astfel încât jurnalul și pariurile folosesc exact aceleași căi: data/users/<uid>/... */
(function(){
  const FIREBASE_CONFIG={ /* proiectul Firebase „MyActivity” */
    apiKey:"AIzaSyDQeBrb22f7KbiKa4dQb6wmiw45wgs9UMM",
    authDomain:"myactivity9.firebaseapp.com",
    projectId:"myactivity9",
    storageBucket:"myactivity9.firebasestorage.app",
    messagingSenderId:"140434832126",
    appId:"1:140434832126:web:d1f6e071f37edae0ff03af"
  };
  if(window.claude||!/github\.io$/.test(location.hostname)||!FIREBASE_CONFIG)return;
  const V="10.12.2",acct=document.getElementById("acct");
  const load=src=>new Promise((ok,bad)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=bad;document.head.appendChild(s)});
  let resolveReady;const ready=new Promise(r=>resolveReady=r);
  window.claude={__firebase:true,use:async name=>{const ctx=await ready;if(!ctx)return null;
    if(name==="db")return {doc:p=>ctx.fs.doc(p),collection:p=>ctx.fs.collection(p)};
    if(name==="user")return {id:async()=>ctx.user.uid,isOwner:()=>true};
    return null}};
  function show(html){acct.innerHTML=html;acct.hidden=false}
  (async()=>{
    try{
      await load(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
      await Promise.all([load(`https://www.gstatic.com/firebasejs/${V}/firebase-auth-compat.js`),load(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`)]);
    }catch(e){resolveReady(null);show('<span>Nu am putut încărca sincronizarea. Datele se salvează în acest browser.</span>');return}
    firebase.initializeApp(FIREBASE_CONFIG);
    const auth=firebase.auth(),fs=firebase.firestore();
    let first=true;
    auth.onAuthStateChanged(user=>{
      if(!first){location.reload();return}
      first=false;
      if(user){
        resolveReady({fs,user});
        show(`<span>Sincronizat ca <b>${(user.email||"").replace(/[<>&"]/g,"")}</b></span><button type="button" id="acctOut">Ieșire</button>`);
        document.getElementById("acctOut").onclick=()=>auth.signOut();
      }else{
        resolveReady(null);
        show('<span>Datele stau doar în acest browser.</span><button type="button" id="acctIn" class="on">Conectează-te cu Google</button>');
        document.getElementById("acctIn").onclick=async()=>{
          const p=new firebase.auth.GoogleAuthProvider();
          try{await auth.signInWithPopup(p)}catch(e){
            if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"))auth.signInWithRedirect(p);
            else if(e&&e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request")show('<span>Conectarea nu a mers ('+String(e.code||"eroare").replace(/[<>&"]/g,"")+'). Încearcă din nou.</span>');
          }
        };
      }
    });
  })();
})();
</script>

<script>
(function(){
const DAYS=["duminică","luni","marți","miercuri","joi","vineri","sâmbătă"];
const DSHORT=["D","L","Ma","Mi","J","V","S"];
const MON=["ian","feb","mar","apr","mai","iun","iul","aug","sep","oct","nov","dec"];
const MONL=["ianuarie","februarie","martie","aprilie","mai","iunie","iulie","august","septembrie","octombrie","noiembrie","decembrie"];
const WEEK=[1,2,3,4,5,6,0];
const LS="jurnal-sedinta-v1";

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const prevWork=s=>{let d=addDays(s,-1);while([0,6].includes(parse(d).getDay()))d=addDays(d,-1);return d};
const nextWork=s=>{let d=addDays(s,1);while([0,6].includes(parse(d).getDay()))d=addDays(d,1);return d};
const shortDate=s=>{const d=parse(s);return DAYS[d.getDay()].slice(0,3)+" "+d.getDate()+" "+MON[d.getMonth()]};
const longDate=s=>{const d=parse(s);return DAYS[d.getDay()]+", "+d.getDate()+" "+MONL[d.getMonth()]};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);

let state={v:1,tasks:[],recurring:[],issues:[],notes:[]};
let view=today(), tab="day", openPostpone=null, openNote=null, editing=null, recDraft=[1,2,3,4,5];
let calMonth=null, q="", dateFor=null, addPinned=false;
try{const raw=localStorage.getItem(LS);if(raw)state=normalize(JSON.parse(raw))}catch(e){}

function normalize(s){
  s=s&&typeof s==="object"?s:{};
  const seen=new Set();
  const tasks=(Array.isArray(s.tasks)?s.tasks:[]).filter(t=>t&&t.id&&!seen.has(t.id)&&seen.add(t.id));
  return {v:1,tasks,recurring:Array.isArray(s.recurring)?s.recurring:[],issues:Array.isArray(s.issues)?s.issues:[],notes:Array.isArray(s.notes)?s.notes:[]};
}

/* ---------- salvare: db privat per persoană, cu rezervă în browser ---------- */
let ref=null, saveTimer=null, inflight=0, saving=Promise.resolve(), lastJSON=JSON.stringify(state);
function setSync(t){$("sync").textContent=t}
function persist(){
  prune();
  const json=JSON.stringify(state);
  if(json===lastJSON)return;
  lastJSON=json;
  try{localStorage.setItem(LS,json)}catch(e){}
  if(!ref)return;
  clearTimeout(saveTimer);
  setSync("Se salvează…");
  saveTimer=setTimeout(()=>{
    saveTimer=null;inflight++;
    const body=JSON.parse(lastJSON);
    saving=saving.then(()=>ref.set(body)).then(()=>{inflight--;setSync("Salvat")}).catch(e=>{inflight--;
      setSync(e&&e.code==="quota_exceeded"?"Spațiul de stocare e plin. Șterge activități vechi.":"Nu s-a putut salva acum. Modificările rămân în acest browser.");
    });
  },500);
}
function prune(){
  const cut=addDays(today(),-120);
  state.tasks=state.tasks.filter(t=>!(t.status==="done"&&(t.doneOn||t.date||"")<cut));
  state.issues=state.issues.filter(i=>!(i.resolved&&(i.resolvedOn||"")<cut));
}
async function connect(){
  if(!window.claude||!window.claude.use){setSync("Salvat în acest browser");return}
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    const id=user?await user.id():null;
    if(!db||!id){setSync("Salvat în acest browser");return}
    ref=db.doc("data/users/"+id+"/jurnal");
    let first=true;
    ref.onSnapshot(snap=>{
      if(snap.exists){
        const json=JSON.stringify(normalize(snap.data()));
        if(json!==lastJSON&&!snap.metadata.hasPendingWrites&&!saveTimer&&!inflight){
          state=normalize(JSON.parse(json));lastJSON=json;
          try{localStorage.setItem(LS,json)}catch(e){}
          render();
        }
      }else if(first&&(state.tasks.length||state.recurring.length||state.issues.length||state.notes.length)){
        setTimeout(()=>{lastJSON="";persist()},0);
      }
      if(first){first=false;setSync("Sincronizat pe toate dispozitivele tale");setTimeout(()=>{if(genRecurring(today()))persist();render()},0)}
    },()=>setSync("Sincronizarea s-a oprit. Reîncarcă pagina."));
  }catch(e){setSync("Salvat în acest browser")}
}

/* ---------- logică ---------- */
function genRecurring(day){
  if(day!==today())return false;
  const wd=parse(day).getDay();let changed=false;
  state.recurring.forEach(r=>{
    if(!r.days.includes(wd))return;
    const id="r_"+r.id+"_"+day;
    if(state.tasks.some(t=>t.id===id))return;
    state.tasks.push({id,title:r.title,date:day,status:"todo",recurId:r.id,createdAt:Date.now(),ord:nextOrd()});
    changed=true;
  });
  return changed;
}
const find=id=>state.tasks.find(t=>t.id===id);
function setStatus(t,s){
  t.status=s;
  if(s==="done")t.doneOn=today();else delete t.doneOn;
  if(s!=="done"&&t.date&&t.date>today()){}
}
function dayLists(d){
  const isToday=d===today();
  const late=isToday?state.tasks.filter(t=>t.date&&t.date<d&&(t.status==="todo"||t.status==="doing")):[];
  const day=state.tasks.filter(t=>t.status!=="later"&&(t.date===d||(t.status==="done"&&t.doneOn===d&&t.date&&t.date<d)));
  return {late:sortOrd(late),day:sortOrd(day)};
}
/* ordinea o stabilești tu: câmpul ord; activitățile fără ord rămân în ordinea adăugării */
const ordOf=t=>typeof t.ord==="number"?t.ord:(t.createdAt||0)/1e13;
function sortOrd(a){return a.sort((x,y)=>((y.pinned?1:0)-(x.pinned?1:0))||(ordOf(x)-ordOf(y))||((x.createdAt||0)-(y.createdAt||0)))}
function nextOrd(){return state.tasks.reduce((m,t)=>Math.max(m,ordOf(t)),0)+1}
function move(id,list,dir){
  const lists=dayLists(view);const arr=lists[list];if(!arr)return false;
  const i=arr.findIndex(t=>t.id===id),j=i+dir;
  if(i<0||j<0||j>=arr.length||!!arr[i].pinned!==!!arr[j].pinned)return false;
  arr.forEach((t,k)=>t.ord=k+1);
  arr[i].ord=j+1;arr[j].ord=i+1;
  return true;
}

  const sched=ctx==="sched"?`<span class="tag">${shortDate(t.date)}</span>`:"";
  const rec=t.recurId?`<span class="tag">↻ recurentă</span>`:"";

    ?`<input class="title-edit" id="edit-${t.id}" data-edit="${t.id}" value="${esc(t.title)}" aria-label="Editează activitatea">`
    :`<span class="title" data-act="edit" data-id="${t.id}" title="Click pentru a edita">${esc(t.title)}</span>`;
  const meta=[lateTag,fromBack,sched,rec,moved].join("");
  const seg=ctx==="later"
    ?`<button class="ghost" data-act="totoday" data-id="${t.id}">Pe azi</button>`
    :`<div class="seg" role="group" aria-label="Status">
        ${[["todo","De făcut"],["doing","În lucru"],["done","Gata"]].map(([s,l])=>`<button class="s-${s}" aria-pressed="${t.status===s}" data-act="st" data-s="${s}" data-id="${t.id}">${l}</button>`).join("")}
      </div>`;
  const pp=openPostpone===t.id?`<div class="postpone">
      <span class="hint">Mută pe:</span>
      <button class="ghost" data-act="pp" data-to="${nextWork(today())}" data-id="${t.id}">Ziua lucrătoare următoare</button>
      <input type="date" id="ppd-${t.id}" min="${addDays(today(),1)}" aria-label="Alege data">
      <button class="ghost" data-act="ppdate" data-id="${t.id}">Mută</button>
      <button class="ghost" data-act="pp" data-to="" data-id="${t.id}">Fără dată</button>
      <button class="mini" data-act="ppclose" data-id="${t.id}">Renunță</button>
    </div>`:"";
  const movable=ctx==="late"||ctx==="day";
  const mv=movable?`<button class="grip" data-grip="${t.id}" data-list="${ctx}" aria-label="Trage pentru a muta. Cu tastatura: săgeți sus/jos" title="Trage pentru a muta">⋮⋮</button>`:"";
  const noteView=t.note&&openNote!==t.id?`<div class="note">${esc(t.note)}</div>`:"";
  const noteEdit=openNote===t.id?`<div class="note-box">
      <textarea id="note-${t.id}" data-note="${t.id}" rows="3" placeholder="Observații: detalii, cu cine ai vorbit, ce aștepți…">${esc(t.note||"")}</textarea>
      <button class="ghost" data-act="noteclose" data-id="${t.id}">Gata</button>
    </div>`:"";
  return `<li class="task st-${t.status} ${ctx==="late"?"is-late":""} ${movable?"has-move":""}" ${movable?`data-list="${ctx}" data-id="${t.id}" data-pin="${t.pinned?1:0}"`:""}>
    ${mv}
    <div class="main">${t.pinned?`<span class="pin-flag"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M16 3a1 1 0 0 1 .7 1.7L15 6.4v4.2l2.7 2.7a1 1 0 0 1-.7 1.7h-4v5.5a1 1 0 0 1-2 0V15H7a1 1 0 0 1-.7-1.7L9 10.6V6.4L7.3 4.7A1 1 0 0 1 8 3h8z"/></svg>Fixată sus</span>`:""}${title}${meta?`<div class="meta">${meta}</div>`:""}${noteView}</div>
    <div class="actions">${seg}
      ${ctx!=="later"?`<button class="mini pinbtn ${t.pinned?"on":""}" data-act="pin" data-id="${t.id}" aria-pressed="${!!t.pinned}" title="${t.pinned?"Anulează fixarea":"Fixează sus"}"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M16 3a1 1 0 0 1 .7 1.7L15 6.4v4.2l2.7 2.7a1 1 0 0 1-.7 1.7h-4v5.5a1 1 0 0 1-2 0V15H7a1 1 0 0 1-.7-1.7L9 10.6V6.4L7.3 4.7A1 1 0 0 1 8 3h8z"/></svg>${t.pinned?"Fixată":"Fixează"}</button>`:""}
      <button class="mini ${t.note?"has-note":""}" data-act="note" data-id="${t.id}">${t.note?"Observații •":"Observații"}</button>
      ${t.status!=="done"&&ctx!=="later"?`<button class="mini" data-act="ppopen" data-id="${t.id}">Altă dată</button>`:""}
      <button class="mini" data-act="del" data-id="${t.id}" aria-label="Șterge">Șterge</button>
    </div>${noteEdit}${pp}</li>`;
}
function sec(el,title,count,inner,emptyText){
  el.innerHTML=`<div class="sec-head"><h2>${title}</h2><span class="count">${count}</span></div>`+(inner||`<div class="empty">${emptyText}</div>`);
}
function render(){
  if(drag&&drag.on)return;
  const isToday=view===today();
  $("eyebrow").textContent=isToday?"Ședința de dimineață · azi":(view<today()?"Istoric":"Planificare");
  $("dayTitle").textContent=longDate(view).replace(/^./,c=>c.toUpperCase());
  $("todayBtn").disabled=isToday;
  $("tabDay").setAttribute("aria-selected",tab==="day");$("tabRec").setAttribute("aria-selected",tab==="rec");$("tabDone").setAttribute("aria-selected",tab==="done");
  $("viewDone").hidden=tab!=="done"||!!q;if(tab==="done"&&!q)renderDone();
  $("viewDay").hidden=tab!=="day"||!!q;$("viewRec").hidden=tab!=="rec"||!!q;
  $("viewSearch").hidden=!q;if(q)renderSearch();
  if(dateFor!==view){dateFor=view;$("addDate").value=view}
  $("addPin").setAttribute("aria-pressed",addPinned);
  $("addInput").placeholder=isToday?"Ce faci azi? Scrie și apasă Enter":"Adaugă activitate pentru "+shortDate(view);

  const {late,day}=dayLists(view);
  const c=s=>day.filter(t=>t.status===s).length;
  $("stats").innerHTML=`<span class="stat done"><b>${c("done")}</b> gata</span><span class="stat doing"><b>${c("doing")}</b> în lucru</span><span class="stat"><b>${c("todo")}</b> de făcut</span>`+(late.length?`<span class="stat late"><b>${late.length}</b> rămase din urmă</span>`:"");

  $("secLate").hidden=!late.length;
  if(late.length)sec($("secLate"),"Rămase din urmă",late.length,`<ul class="list">${late.map((t,i,a)=>taskHTML(t,"late",i,a.length)).join("")}</ul>`);

  sec($("secToday"),isToday?"Azi":"Activitățile zilei",day.length,
    day.length?`<ul class="list">${day.map((t,i,a)=>taskHTML(t,"day",i,a.length)).join("")}</ul>`:"",
    isToday?"Nimic planificat încă. Scrie mai sus ce spui la ședință, iar activitățile recurente le setezi din tab-ul Recurente.":"Nicio activitate în această zi.");

  const issues=state.issues.filter(i=>!i.resolved||i.resolvedOn===view);
  $("secIssues").hidden=!isToday&&!issues.length;
  sec($("secIssues"),"Probleme și blocaje",issues.filter(i=>!i.resolved).length+" deschise",
    `${issues.length?`<ul class="list">${issues.map(i=>`<li class="issue ${i.resolved?"res":""}">
        <span class="txt">${esc(i.text)}<div class="meta"><span class="tag">din ${shortDate(i.date)}</span></div></span>
        <button class="mini" data-act="iss" data-id="${i.id}">${i.resolved?"Redeschide":"Rezolvat"}</button>
        <button class="mini" data-act="issdel" data-id="${i.id}">Șterge</button></li>`).join("")}</ul>`:`<div class="empty">Nicio problemă deschisă.</div>`}
     <form class="addrow" id="issForm"><input type="text" id="issInput" placeholder="ex. Aștept răspuns de la furnizor" autocomplete="off"><button class="ghost" type="submit">Adaugă problemă</button></form>`);

  const notes=state.notes;
  $("secNotes").hidden=!isToday&&!notes.length;
  sec($("secNotes"),"Alte observații",notes.length,
    `${notes.length?`<ul class="list">${notes.map(n=>`<li class="issue">
        <span class="txt">${esc(n.text)}<div class="meta"><span class="tag">${shortDate(n.date)}</span></div></span>
        <button class="mini" data-act="notedel" data-id="${n.id}">Șterge</button></li>`).join("")}</ul>`:`<div class="empty">Nicio observație. Notează aici ce vrei să mai spui la ședință.</div>`}
     <form class="addrow" id="noteForm"><input type="text" id="noteInput" placeholder="ex. Mâine lipsesc după-amiază" autocomplete="off"><button class="ghost" type="submit">Adaugă observație</button></form>`);

  const undated=state.tasks.filter(t=>t.status==="later");
  const sched=state.tasks.filter(t=>t.status!=="done"&&t.status!=="later"&&t.date>today()).sort((a,b)=>a.date<b.date?-1:1);
  $("secLater").hidden=!isToday;
  if(isToday)sec($("secLater"),"Altă dată",undated.length+sched.length,
    (sched.length||undated.length)?`<ul class="list">${sched.map(t=>taskHTML(t,"sched")).join("")}${undated.map(t=>taskHTML(t,"later")).join("")}</ul>`:"",
    "Activitățile amânate apar aici. Cele cu dată revin singure în ziua aleasă.");

  // recurente
  $("recDays").innerHTML=WEEK.map(d=>`<button type="button" class="day" aria-pressed="${recDraft.includes(d)}" data-act="rdraft" data-d="${d}">${DSHORT[d]}</button>`).join("");
  sec($("secRec"),"Activitățile tale recurente",state.recurring.length,
    state.recurring.length?`<ul class="list">${state.recurring.map(r=>`<li class="rec"><span class="name">${esc(r.title)}</span>

      <button class="mini" data-act="rdel" data-id="${r.id}">Șterge</button></li>`).join("")}</ul>`:"",
    "Nicio recurentă încă. Adaugă mai sus ce faci zilnic sau săptămânal: apar automat în lista zilei.");

  renderCal();renderWeek();
  const setN=(id,v)=>{const el=$(id);if(el)el.textContent=v?String(v):""};
  const tl=dayLists(today());
  setN("nAzi",tl.day.filter(t=>t.status!=="done").length+tl.late.length);
  setN("nRec",state.recurring.length);
  setN("nProb",state.issues.filter(i=>!i.resolved).length);
  setN("nObs",state.notes.length);
  setN("nFin",state.tasks.filter(t=>t.status==="done").length);

  if(!$("summaryBox").hidden)renderSummary();
  if(editing){const el=$("edit-"+editing);if(el){el.focus();el.select()}}
}

/* ---------- calendar, cifrele săptămânii, căutare ---------- */
function dayStatus(d){
  const ts=state.tasks.filter(t=>t.date===d&&t.status!=="later");
  if(!ts.length)return "";
  if(ts.every(t=>t.status==="done"))return "done";
  return d<today()?"late":"plan";
}
function renderCal(){
  if(!calMonth)calMonth=view.slice(0,7);
  const [y,m]=calMonth.split("-").map(Number);
  const first=new Date(y,m-1,1),off=(first.getDay()+6)%7;
  const start=new Date(y,m-1,1-off);
  let cells="";
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    if(i>=35&&d.getMonth()!==m-1)break;
    const k=ymd(d),st=dayStatus(k),wd=d.getDay();
    const cls=[d.getMonth()!==m-1?"o":"",k===today()?"tdy":"",k===view&&k!==today()?"sel":"",(wd===0||wd===6)?"we":""].join(" ").trim();
    cells+=`<button type="button" class="${cls}" data-act="cal" data-date="${k}" ${st?`data-s="${st}"`:""} aria-label="${longDate(k)}" ${k===view?'aria-current="date"':""}>${d.getDate()}</button>`;
  }
  $("calBox").innerHTML=`<div class="calnav"><button type="button" class="icon-btn" data-act="calm" data-dir="-1" aria-label="Luna anterioară">‹</button><span>${MONL[m-1].replace(/^./,c=>c.toUpperCase())} ${y}</span><button type="button" class="icon-btn" data-act="calm" data-dir="1" aria-label="Luna următoare">›</button></div>
    <div class="cal">${["L","Ma","Mi","J","V","S","D"].map(h=>`<span class="h">${h}</span>`).join("")}${cells}</div>
    <div class="legend"><span><i style="background:var(--done)"></i>totul gata</span><span><i style="background:var(--doing)"></i>de făcut / în lucru</span><span><i style="background:var(--late)"></i>a rămas ceva</span></div>`;
}
function renderWeek(){
  const t0=today(),dow=(parse(t0).getDay()+6)%7,ws=addDays(t0,-dow),we=addDays(ws,6);
  const done=state.tasks.filter(t=>t.status==="done"&&t.doneOn&&t.doneOn>=ws&&t.doneOn<=we).length;
  const doing=state.tasks.filter(t=>t.status==="doing").length;
  const late=dayLists(t0).late.length;
  const later=state.tasks.filter(t=>t.status==="later"||(t.status!=="done"&&t.date&&t.date>t0)).length;
  const planned=state.tasks.filter(t=>t.status!=="later"&&t.date&&t.date>=ws&&t.date<=t0);
  const pct=planned.length?Math.round(planned.filter(t=>t.status==="done").length/planned.length*100):0;
  $("weekBox").innerHTML=`<h3>Pe scurt <span>săptămâna asta</span></h3>
    <div class="kpi"><div class="k g"><small>Terminate</small><b>${done}</b></div><div class="k a"><small>În lucru</small><b>${doing}</b></div>
    <div class="k r"><small>Rămase din urmă</small><b>${late}</b></div><div class="k"><small>Amânate / planificate</small><b>${later}</b></div></div>
    <div class="pbar"><i style="width:${pct}%"></i></div><div class="hint">${planned.length?`${pct}% din activitățile de săptămâna asta sunt gata`:"Nicio activitate planificată săptămâna asta încă"}</div>`;
}
function renderSearch(){
  const n=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const qq=n(q.trim());
  const hits=state.tasks.filter(t=>n(t.title).includes(qq)||(t.note&&n(t.note).includes(qq)))
    .sort((a,b)=>(b.date||"9999")<(a.date||"9999")?-1:1).slice(0,80);
  const hl=txt=>{const i=n(txt).indexOf(qq);return i<0?esc(txt):esc(txt.slice(0,i))+"<mark>"+esc(txt.slice(i,i+qq.length))+"</mark>"+esc(txt.slice(i+qq.length))};
  const col={todo:"var(--late)",doing:"var(--doing)",done:"var(--done)",later:"var(--muted)"};
  $("viewSearch").innerHTML=`<section><div class="sec-head"><h2>Rezultate pentru „${esc(q.trim())}”</h2><span class="count">${hits.length}</span></div>
    ${hits.length?`<div class="sres">${hits.map(t=>`<button type="button" data-act="goto" data-date="${t.date||""}" data-id="${t.id}"><span class="sd">${t.date?shortDate(t.date):"fără dată"}</span><i style="background:${col[t.status]||"var(--muted)"}"></i><span class="st">${hl(t.title)}${t.note?`<small>${hl(t.note)}</small>`:""}</span></button>`).join("")}</div>`:`<div class="empty">Nicio activitate nu conține „${esc(q.trim())}”.</div>`}</section>`;
}

let doneRange="all";
function renderDone(){
  const t0=today(),ws=addDays(t0,-((parse(t0).getDay()+6)%7)),ms=t0.slice(0,8)+"01";
  const from={all:"",week:ws,month:ms}[doneRange]||"";
  const all=state.tasks.filter(t=>t.status==="done");
  const list=all.filter(t=>(t.doneOn||t.date||"")>=from).sort((a,b)=>((b.doneOn||b.date||"")>(a.doneOn||a.date||"")?1:(b.doneOn||b.date||"")<(a.doneOn||a.date||"")?-1:(b.createdAt||0)-(a.createdAt||0)));
  const groups=[];list.forEach(t=>{const k=t.doneOn||t.date||"";const g=groups[groups.length-1];if(g&&g.k===k)g.items.push(t);else groups.push({k,items:[t]})});
  const chips=[["all","Toate"],["week","Săptămâna asta"],["month","Luna asta"]].map(([k,l])=>`<button type="button" class="bt-chip" data-act="drange" data-r="${k}" aria-pressed="${doneRange===k}">${l}</button>`).join("");
  const CK='<svg class="ck" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  $("viewDone").innerHTML=`<section>
    <div class="sec-head"><h2>Activități finalizate</h2><span class="count">${list.length}</span></div>
    <div class="bt-chips" style="margin-top:4px">${chips}</div>
    ${groups.length?groups.map(g=>`<div class="dgrp"><span>${g.k?longDate(g.k):"fără dată"}</span><span>${g.items.length}</span></div>
      <ul class="dlist">${g.items.map(t=>`<li class="ditem">${CK}<div class="dm"><span class="dt">${esc(t.title)}</span>
        ${(t.date&&t.doneOn&&t.date!==t.doneOn)||t.recurId||t.postponed?`<div class="meta">${t.date&&t.doneOn&&t.date!==t.doneOn?`<span class="tag">planificată pe ${shortDate(t.date)}</span>`:""}${t.recurId?`<span class="tag">↻ recurentă</span>`:""}${t.postponed?`<span class="tag">amânată ×${t.postponed}</span>`:""}</div>`:""}
        ${t.note?`<div class="note">${esc(t.note)}</div>`:""}</div>
        <div class="da"><button class="mini" data-act="goto" data-date="${t.date||""}" data-id="${t.id}">Vezi ziua</button><button class="mini" data-act="reopen" data-id="${t.id}">Redeschide</button></div></li>`).join("")}</ul>`).join("")
      :`<div class="empty">${all.length?"Nicio activitate finalizată în perioada aleasă.":"Nicio activitate finalizată încă. Când marchezi o activitate cu „Gata”, apare aici."}</div>`}
    ${all.length?`<div class="hint" style="margin-top:6px">Activitățile finalizate se păstrează 4 luni.</div>`:""}
  </section>`;
}

/* ---------- rezumat ---------- */
function summaryText(){
  const d=view, prev=prevWork(d);
  const {late,day}=dayLists(d);
  const doneYesterday=state.tasks.filter(t=>t.status==="done"&&t.doneOn===prev);
  const N=t=>t.note?" — "+t.note.replace(/\s*\n\s*/g,"; "):"";
  const plan=[...late.map(t=>t.title+" (rămas din urmă"+(t.status==="doing"?", în desfășurare":"")+")"+N(t)),
              ...day.filter(t=>t.status!=="done").map(t=>t.title+(t.status==="doing"?" (în desfășurare)":"")+N(t))];
  const doneToday=day.filter(t=>t.status==="done");
  const open=state.issues.filter(i=>!i.resolved);
  const L=a=>a.length?a.map(x=>"• "+x).join("\n"):"• —";
  let out=`${longDate(prev).replace(/^./,c=>c.toUpperCase())} am terminat:\n${L(doneYesterday.map(t=>t.title))}\n\n`;
  out+=`${d===today()?"Azi":longDate(d).replace(/^./,c=>c.toUpperCase())} lucrez la:\n${L(plan)}`;
  if(doneToday.length)out+=`\n\nDeja terminat azi:\n${L(doneToday.map(t=>t.title))}`;
  out+=`\n\nProbleme / blocaje:\n${open.length?L(open.map(i=>i.text)):"• Nimic de semnalat"}`;
  if(state.notes.length)out+=`\n\nAlte observații:\n${L(state.notes.map(n=>n.text))}`;
  return out;
}
function renderSummary(){
  $("summaryBox").innerHTML=`<div class="row" style="justify-content:space-between"><h2>Ce spui la ședință</h2><div class="row"><button class="ghost" data-act="copy">Copiază</button><button class="mini" data-act="sumclose">Închide</button></div></div><pre id="sumText">${esc(summaryText())}</pre>`;
}

let undo=null,toastTimer=null;

}

document.addEventListener("click",e=>{

  const act=b.dataset.act,id=b.dataset.id,t=id&&find(id);

    case "edit": editing=id;render();break;

    case "cal": view=b.dataset.date;tab="day";openPostpone=null;calMonth=view.slice(0,7);render();break;
    case "calm": {const [y,m]=calMonth.split("-").map(Number);const d=new Date(y,m-1+(+b.dataset.dir),1);calMonth=d.getFullYear()+"-"+pad(d.getMonth()+1);renderCal();break}

    case "pin": if(t){if(t.pinned)delete t.pinned;else t.pinned=true;commit()}break;
    case "note": openNote=openNote===id?null:id;openPostpone=null;render();if(openNote){const ta=$("note-"+id);if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}}break;
    case "noteclose": openNote=null;persist();render();break;
    case "ppopen": openPostpone=openPostpone===id?null:id;render();break;
    case "ppclose": openPostpone=null;render();break;
    case "pp": if(t){if(b.dataset.to){t.date=b.dataset.to;t.status="todo"}else{t.status="later";t.date=null}t.postponed=(t.postponed||0)+1;delete t.doneOn;openPostpone=null;toast(b.dataset.to?"Mutată pe "+shortDate(b.dataset.to):"Mutată la Altă dată");commit()}break;
    case "ppdate": {const v=$("ppd-"+id).value;if(t&&v){t.date=v;t.status="todo";t.postponed=(t.postponed||0)+1;openPostpone=null;toast("Mutată pe "+shortDate(v));commit()}else $("ppd-"+id).focus();break}
    case "totoday": if(t){t.status="todo";t.date=today();commit()}break;
    case "del": if(t){const i=state.tasks.indexOf(t);state.tasks.splice(i,1);commit();toast("Activitate ștearsă",()=>{state.tasks.splice(i,0,t);commit()})}break;
    case "iss": {const x=state.issues.find(i=>i.id===id);if(x){x.resolved=!x.resolved;x.resolvedOn=x.resolved?today():null;commit()}break}
    case "notedel": {const i=state.notes.findIndex(x=>x.id===id);if(i>-1){const x=state.notes.splice(i,1)[0];commit();toast("Observație ștearsă",()=>{state.notes.splice(i,0,x);commit()})}break}
    case "issdel": {const i=state.issues.findIndex(x=>x.id===id);if(i>-1){const x=state.issues.splice(i,1)[0];commit();toast("Problemă ștearsă",()=>{state.issues.splice(i,0,x);commit()})}break}
    case "rdraft": {const d=+b.dataset.d;recDraft=recDraft.includes(d)?recDraft.filter(x=>x!==d):[...recDraft,d];render();break}
    case "rday": {const r=state.recurring.find(x=>x.id===id),d=+b.dataset.d;if(r){r.days=r.days.includes(d)?r.days.filter(x=>x!==d):[...r.days,d];commit()}break}
    case "rdel": {const i=state.recurring.findIndex(x=>x.id===id);if(i>-1){const r=state.recurring.splice(i,1)[0];commit();toast("Recurenta a fost ștearsă",()=>{state.recurring.splice(i,0,r);commit()})}break}
    case "copy": {const txt=summaryText();const done=()=>{b.textContent="Copiat"};
      try{navigator.clipboard.writeText(txt).then(done,()=>selectSum())}catch(err){selectSum()}break}
    case "sumclose": $("summaryBox").hidden=true;break;
    case "pal": setPalette(b.dataset.p);break;
    case "export": {let pariuri={};try{pariuri={bets:JSON.parse(localStorage.getItem("bt-bets")||"[]"),settings:JSON.parse(localStorage.getItem("bt-settings")||"{}"),notite:JSON.parse(localStorage.getItem("bt-notes")||"{}"),tranzactii:JSON.parse(localStorage.getItem("bt-txns")||"[]")}}catch(err){}
      const blob=new Blob([JSON.stringify({...state,pariuri},null,1)],{type:"application/json"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="jurnal-sedinta-"+today()+".json";
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast("Backup descărcat");break}
    case "undo": if(undo){const f=undo;undo=null;$("toast").hidden=true;f()}break;
  }
});

/* ---------- tragere cu mouse-ul / degetul ---------- */
let drag=null,suppressClick=false;
document.addEventListener("pointerdown",e=>{
  if(e.button!==0)return;
  const li=e.target.closest("li.task[data-list]");if(!li||editing||openNote)return;
  const onGrip=!!e.target.closest(".grip");
  if(!onGrip&&(e.pointerType!=="mouse"||e.target.closest("button,input,textarea,label,select,a")))return;
  drag={li,ul:li.parentElement,id:li.dataset.id,list:li.dataset.list,startY:e.clientY,y:e.clientY,on:false,pid:e.pointerId};
});
function dragStep(){
  const {li,ul}=drag;const gap=parseFloat(getComputedStyle(ul).rowGap)||6;
  let moved=true;
  while(moved){moved=false;
    const prev=li.previousElementSibling,next=li.nextElementSibling;
    if(prev&&prev.dataset.pin===li.dataset.pin){const r=prev.getBoundingClientRect();if(drag.y<r.top+r.height/2){ul.insertBefore(li,prev);drag.startY-=r.height+gap;moved=true;continue}}
    if(next&&next.dataset.pin===li.dataset.pin){const r=next.getBoundingClientRect();if(drag.y>r.top+r.height/2){ul.insertBefore(next,li);drag.startY+=r.height+gap;moved=true}}
  }
  li.style.transform=`translateY(${drag.y-drag.startY}px)`;
}
document.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  drag.y=e.clientY;
  if(!drag.on){if(Math.abs(drag.y-drag.startY)<6)return;
    drag.on=true;drag.li.classList.add("dragging");document.body.classList.add("is-dragging");
    try{drag.li.setPointerCapture(e.pointerId)}catch(err){}}
  e.preventDefault();
  const edge=70,h=innerHeight;let sc=0;
  if(drag.y<edge)sc=-Math.ceil((edge-drag.y)/6);else if(drag.y>h-edge)sc=Math.ceil((drag.y-(h-edge))/6);
  if(sc){const before=scrollY;scrollBy(0,sc);drag.startY-=scrollY-before}
  dragStep();
},{passive:false});
function endDrag(e){
  if(!drag||(e&&e.pointerId!==drag.pid))return;
  const d=drag;drag=null;
  if(!d.on)return;
  document.body.classList.remove("is-dragging");d.li.classList.remove("dragging");d.li.style.transform="";
  suppressClick=true;setTimeout(()=>suppressClick=false,0);
  const ids=[...d.ul.querySelectorAll(":scope > li.task[data-id]")].map(x=>x.dataset.id);
  let changed=false;
  ids.forEach((id,k)=>{const t=find(id);if(t&&t.ord!==k+1){t.ord=k+1;changed=true}});
  if(changed)commit();else render();
}
document.addEventListener("pointerup",endDrag);
document.addEventListener("pointercancel",endDrag);
document.addEventListener("click",e=>{if(suppressClick){e.stopPropagation();e.preventDefault();suppressClick=false}},true);
document.addEventListener("keydown",e=>{
  const g=e.target.closest&&e.target.closest(".grip");if(!g||(e.key!=="ArrowUp"&&e.key!=="ArrowDown"))return;
  e.preventDefault();const id=g.dataset.grip;
  if(move(id,g.dataset.list,e.key==="ArrowUp"?-1:1)){commit();const ng=document.querySelector(`.grip[data-grip="${id}"]`);if(ng)ng.focus()}
});

$("backup").hidden=!standalone;

      if(data.pariuri&&Array.isArray(data.pariuri.bets)){try{localStorage.setItem("bt-bets",JSON.stringify(data.pariuri.bets));localStorage.setItem("bt-settings",JSON.stringify(data.pariuri.settings||{}));if(data.pariuri.notite)localStorage.setItem("bt-notes",JSON.stringify(data.pariuri.notite));if(data.pariuri.tranzactii)localStorage.setItem("bt-txns",JSON.stringify(data.pariuri.tranzactii))}catch(err){}document.dispatchEvent(new Event("bt-reload"))}
      toast("Backup încărcat",()=>{state=prev;commit()})}catch(err){toast("Fișierul nu e un backup valid al jurnalului")}
    e.target.value=""};
  r.readAsText(f);
});

if(genRecurring(today()))persist();
render();
connect();
})();

<script>
/* ---------- comutator Activități / Pariuri ---------- */
(function(){
  const KEY="app-tab";

    document.getElementById("btApp").hidden=!bets;

  }
  document.getElementById("swAct").onclick=()=>show("activitati");
  document.getElementById("swBet").onclick=()=>show("pariuri");

/* ---------- jurnal de pariuri ---------- */
(function(){
const MARKETS=["1X2","Șansă dublă","GG / NG","Peste/Sub goluri","Handicap","Cornere","Cartonașe","Marcator","Pauză/Final","Bilet combinat","Altul"];
/* tipurile noi (venite din „Lipește bilet”) apar automat în listă, înainte de „Altul” */
function allMarkets(cur){const extra=[...new Set([...bets.map(b=>b.market),cur].filter(m=>m&&!MARKETS.includes(m)))];return [...MARKETS.slice(0,-1),...extra,"Altul"]}
const RES={pending:"În așteptare",won:"Câștigat",lost:"Pierdut",void:"Anulat",cashout:"Cashout"};
const LSB="bt-bets", LSS="bt-settings";
let bets=[], settings={bankroll:500,currency:"RON",monthlyBudget:0,maxPct:3};
let col=null, setRef=null, period="all", tab="bets";
const $=id=>document.getElementById(id);
const n=v=>Number(v)||0;
const pad=x=>String(x).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const monthKey=d=>(d||"").slice(0,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function profit(b){
  if(b.result==="won")return n(b.stake)*(n(b.odds)-1);
  if(b.result==="lost")return -n(b.stake);
  if(b.result==="cashout")return n(b.cashout)-n(b.stake);
  return 0;
}
const settled=b=>b.result!=="pending";
/* bankroll disponibil: miza unui pariu în așteptare iese din bankroll până afli rezultatul;
   câștigat → revine miza × cota, pierdut → miza rămâne scăzută, anulat → revine miza */
const pendingStake=list=>list.filter(b=>b.result==="pending").reduce((a,b)=>a+n(b.stake),0);
const LSX="bt-txns";
let txns=lsGet(LSX,[]);
/* depuneri și bonusuri intră în bankroll, retragerile ies */
const txNet=()=>txns.reduce((a,t)=>a+(t.type==="ret"?-1:1)*n(t.amount),0);
const bankNow=()=>n(settings.bankroll)+txNet()+summarize(bets).profit-pendingStake(bets);
function fmt(v,sign){const s=Math.abs(v).toLocaleString("ro-RO",{minimumFractionDigits:2,maximumFractionDigits:2});return (sign?(v>0?"+":v<0?"−":""):(v<0?"−":""))+s+" "+settings.currency}
const pct=v=>(v>0?"+":"")+v.toLocaleString("ro-RO",{maximumFractionDigits:1})+"%";
const sortBets=a=>a.slice().sort((x,y)=>(y.date||"").localeCompare(x.date||"")||n(y.createdAt)-n(x.createdAt));
function inPeriod(b){
  if(period==="month")return monthKey(b.date)===today().slice(0,7);
  if(period==="7d")return (new Date(today())-new Date(b.date))/864e5<=7;
  return true;
}
function summarize(list){
  const s=list.filter(settled),dec=s.filter(b=>b.result!=="void");
  const staked=dec.reduce((a,b)=>a+n(b.stake),0),p=s.reduce((a,b)=>a+profit(b),0);
  const wins=dec.filter(b=>b.result==="won"||(b.result==="cashout"&&profit(b)>0)).length;
  return {profit:p,staked,roi:staked?p/staked*100:0,wr:dec.length?wins/dec.length*100:0,avgOdds:dec.length?dec.reduce((a,b)=>a+n(b.odds),0)/dec.length:0,settled:s.length};
}
function fmtDate(d){if(!d)return"";const [y,m,dd]=d.split("-");return dd+"."+m+"."+y.slice(2)}

function render(){
  const all=sortBets(bets),view=all.filter(inPeriod),sAll=summarize(all),s=summarize(view);
  const inPlay=pendingStake(all);
  $("btBank").textContent=fmt(bankNow());
  $("btInPlay").textContent=`${fmt(inPlay)} în joc, scăzuți până afli rezultatul`;$("btInPlay").hidden=!inPlay;
  const pf=$("btProfit");pf.textContent=fmt(s.profit,true);pf.className="bt-delta "+(s.profit>0?"pos":s.profit<0?"neg":"");
  $("btRoi").textContent=s.staked?pct(s.roi):"–";
  $("btWr").textContent=s.settled?Math.round(s.wr)+"%":"–";
  $("btOdds").textContent=s.avgOdds?s.avgOdds.toFixed(2):"–";
  $("btN").textContent=view.length;
  const pend=all.filter(b=>b.result==="pending").length;
  const badge=$("swBetBadge");badge.textContent=pend;badge.hidden=!pend;
  spark(all);alerts(all);filters();
  $("btViewBets").hidden=tab!=="bets";$("btViewStats").hidden=tab!=="stats";$("btViewNotes").hidden=tab!=="notes";$("btViewMoney").hidden=tab!=="money";$("btFilters").hidden=tab==="notes"||tab==="money";
  $("btTabBets").setAttribute("aria-selected",tab==="bets");$("btTabStats").setAttribute("aria-selected",tab==="stats");$("btTabNotes").setAttribute("aria-selected",tab==="notes");$("btTabMoney").setAttribute("aria-selected",tab==="money");
  if(tab==="bets")renderBets(view);else if(tab==="stats")renderStats(view,s);
}
function spark(all){
  let v=n(settings.bankroll);const pts=[v];
  const ev=[...all.filter(settled).map(b=>({d:b.date||"",c:n(b.createdAt),x:profit(b)})),...txns.map(t=>({d:t.date||"",c:n(t.createdAt),x:(t.type==="ret"?-1:1)*n(t.amount)}))].sort((a,b)=>a.d.localeCompare(b.d)||a.c-b.c);
  ev.forEach(e=>{v+=e.x;pts.push(v)});const ip=pendingStake(all);if(ip)pts.push(v-ip);
  const svg=$("btSpark");
  if(pts.length<2){svg.innerHTML='<line x1="0" y1="32" x2="300" y2="32" stroke="currentColor" stroke-opacity=".4" stroke-dasharray="4 4"/>';return}
  const min=Math.min(...pts),max=Math.max(...pts),r=(max-min)||1;
  const x=i=>i/(pts.length-1)*296+2,y=p=>58-(p-min)/r*52;
  const d=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p).toFixed(1)).join(" ");
  const col=pts[pts.length-1]>=pts[0]?"var(--done)":"var(--late)",base=y(n(settings.bankroll));
  svg.innerHTML=`<line x1="0" x2="300" y1="${base}" y2="${base}" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>
  <path d="${d} L298 64 L2 64Z" style="fill:${col}" fill-opacity=".14"/>
  <path d="${d}" fill="none" style="stroke:${col}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
  <circle cx="${x(pts.length-1)}" cy="${y(pts[pts.length-1])}" r="3.5" style="fill:${col}"/>`;
}
function alerts(all){
  const out=[];
  if(all.some(b=>b.example))out.push('<div class="bt-ex"><span>Pariurile marcate „Exemplu” sunt doar demonstrative.</span><button class="bt-link" type="button" id="btClearEx">Șterge exemplele</button></div>');
  const mb=n(settings.monthlyBudget);
  if(mb>0){
    const spent=all.filter(b=>!b.example&&monthKey(b.date)===today().slice(0,7)&&b.result!=="void").reduce((a,b)=>a+n(b.stake),0);
    if(spent>=mb)out.push(`<div class="bt-alert">Ai mizat ${fmt(spent)} luna asta, peste bugetul de ${fmt(mb)}.</div>`);
    else if(spent>=mb*.8)out.push(`<div class="bt-alert">Ai folosit ${Math.round(spent/mb*100)}% din bugetul lunar (${fmt(spent)} din ${fmt(mb)}).</div>`);
  }
  let streak=0;for(const b of all.filter(b=>b.result==="lost"||b.result==="won")){if(b.result==="lost")streak++;else break}
  if(streak>=4)out.push(`<div class="bt-alert">${streak} pariuri pierdute la rând. Poate e momentul pentru o pauză.</div>`);
  $("btAlerts").innerHTML=out.join("");$("btAlerts").hidden=!out.length;
  const ce=$("btClearEx");if(ce)ce.onclick=clearExamples;
}
function filters(){
  const o=[["all","Tot"],["month","Luna asta"],["7d","Ultimele 7 zile"]];
  $("btFilters").innerHTML=o.map(([k,l])=>`<button class="bt-chip" type="button" data-p="${k}" aria-pressed="${period===k}">${l}</button>`).join("");
  $("btFilters").querySelectorAll("button").forEach(b=>b.onclick=()=>{period=b.dataset.p;render()});
}
function slip(b){
  const p=profit(b),r=b.result;
  const pl=r==="pending"?`<span class="bt-hint">poți câștiga ${fmt(n(b.stake)*n(b.odds))}</span>`:`<span class="bt-pl ${p>0?"pos":p<0?"neg":""}">${fmt(p,true)}</span>`;
  return `<div><button class="bt-slip ${r}" type="button" data-bid="${b.id}"><span class="stripe"></span><span class="body">
    <span class="l1"><span>${esc(fmtDate(b.date))}${b.comp?" · "+esc(b.comp):""}</span><span>${b.example?'<span class="bt-exmark">Exemplu</span> · ':""}${esc(b.book||"")}</span></span>
    <span class="match">${esc(b.match||"Fără meci")}</span>
    <span class="l3"><span class="bt-pick">${esc(b.market||"")}${b.pick?": "+esc(b.pick):""} @ <b>${n(b.odds).toFixed(2)}</b> · ${fmt(n(b.stake))}</span><span class="bt-pill ${r}">${RES[r]}</span></span>
    <span class="l3">${pl}</span></span></button>
    ${r==="pending"?`<div class="bt-quick"><button class="w" type="button" data-q="won" data-bid="${b.id}">✓ Câștigat</button><button class="x" type="button" data-q="lost" data-bid="${b.id}">✗ Pierdut</button><button type="button" data-q="void" data-bid="${b.id}">Anulat</button></div>`:""}</div>`;
}
function renderBets(view){
  const el=$("btViewBets");
  if(!view.length){el.innerHTML='<div class="bt-empty"><strong>Niciun pariu încă.</strong><br>Apasă „+ Pariu” ca să adaugi primul. Statisticile se calculează singure.</div>';return}
  const pend=view.filter(b=>b.result==="pending"),done=view.filter(settled);
  el.innerHTML=(pend.length?`<div class="bt-group">În așteptare · ${pend.length}</div>`+pend.map(slip).join(""):"")+(done.length?`<div class="bt-group">Încheiate · ${done.length}</div>`+done.map(slip).join(""):"");
  el.querySelectorAll(".bt-slip").forEach(x=>x.onclick=()=>openSheet(bets.find(b=>b.id===x.dataset.bid)));
  el.querySelectorAll("[data-q]").forEach(x=>x.onclick=()=>quickSettle(x.dataset.bid,x.dataset.q));
}
function breakdown(view,key,title){
  const m={};view.filter(settled).forEach(b=>{const k=(b[key]||"").trim()||"Nespecificat";(m[k]=m[k]||[]).push(b)});
  const rows=Object.entries(m).map(([k,l])=>({k,...summarize(l)})).sort((a,b)=>b.profit-a.profit);
  if(!rows.length)return"";
  const mx=Math.max(...rows.map(r=>Math.abs(r.profit)),1);
  return `<div class="bt-card"><h2>${title}</h2><div class="bt-brk">${rows.map(r=>{const w=Math.abs(r.profit)/mx*50,pos=r.profit>=0;
    return `<div class="bt-brow"><span class="n">${esc(r.k)}</span><span class="bt-pl ${pos?"pos":"neg"}" style="font-size:16px">${fmt(r.profit,true)}</span>
    <span class="bt-bar"><i style="background:var(${pos?"--done":"--late"});${pos?`left:50%;width:${w}%`:`right:50%;width:${w}%`}"></i></span>
    <span class="meta">${r.settled} pariuri · ROI ${r.staked?pct(r.roi):"–"} · câștig ${Math.round(r.wr)}%</span></div>`}).join("")}</div></div>`;
}
function renderStats(view,s){
  const el=$("btViewStats");
  if(!view.filter(settled).length){el.innerHTML='<div class="bt-empty">Statisticile apar după primul pariu încheiat.</div>';return}
  let maxW=0,maxL=0,lw=0,ll=0;sortBets(view.filter(b=>b.result==="won"||b.result==="lost")).reverse().forEach(b=>{if(b.result==="won"){lw++;ll=0}else{ll++;lw=0}maxW=Math.max(maxW,lw);maxL=Math.max(maxL,ll)});
  const best=view.filter(settled).reduce((a,b)=>!a||profit(b)>profit(a)?b:a,null);
  const pend=view.filter(b=>b.result==="pending").reduce((a,b)=>a+n(b.stake),0);
  el.innerHTML=`<div class="bt-card"><h2>Pe scurt</h2><div class="bt-stat2">
    <div><span class="lbl">Total mizat</span><span class="v">${fmt(s.staked)}</span></div>
    <div><span class="lbl">Miză medie</span><span class="v">${fmt(s.settled?s.staked/s.settled:0)}</span></div>
    <div><span class="lbl">Cea mai lungă serie +</span><span class="v">${maxW}</span></div>
    <div><span class="lbl">Cea mai lungă serie −</span><span class="v">${maxL}</span></div>
    <div><span class="lbl">Bani în joc acum</span><span class="v">${fmt(pend)}</span></div>
    <div><span class="lbl">Cel mai bun pariu</span><span class="v">${best?fmt(profit(best),true):"–"}</span></div>
  </div></div>`+breakdown(view,"market","Pe tip de pariu")+breakdown(view,"comp","Pe competiție")+breakdown(view,"book","Pe casă de pariuri");
}

function closeSheet(){$("btSheet").hidden=true;$("btScrim").hidden=true;$("btSheet").innerHTML=""}
/* lipire bilet: textul primit de la Claude (JSON) → unul sau mai multe pariuri */
function parseTicket(txt){
  txt=String(txt||"").replace(/```[a-z]*|```/gi,"").trim();
  const a=txt.search(/[\[{]/);if(a<0)throw new Error("Nu găsesc datele biletului în text.");
  let data;try{data=JSON.parse(txt.slice(a))}catch(e){throw new Error("Textul nu e complet. Copiază tot mesajul primit și încearcă din nou.")}
  let list=Array.isArray(data)?data:Array.isArray(data.pariuri)?data.pariuri:[data];
  const nr=v=>typeof v==="number"?v:n(String(v??"").replace(",","."));
  const okRes=Object.keys(RES);
  return list.map((x,i)=>{
    if(!x||typeof x!=="object")throw new Error("Pariul "+(i+1)+" nu e valid.");
    const legs=Array.isArray(x.legs)?x.legs:Array.isArray(x.meciuri)?x.meciuri:null;
    let match=String(x.match||x.meci||"").trim(),pick=String(x.pick||x.selectie||"").trim(),market=String(x.market||x.tip||"").trim(),comp=String(x.comp||x.competitie||"").trim();
    if(legs&&legs.length){
      const L=legs.map(l=>({m:String(l.match||l.meci||"").trim(),p:String(l.pick||l.selectie||"").trim()}));
      if(!match)match=L.length===1?L[0].m:L.length+" meciuri: "+L.map(l=>l.m).join(", ");
      if(!pick)pick=L.map(l=>l.p).join(" + ");
      if(!market)market=L.length>1?"Bilet combinat":"Altul";
      if(!comp&&L.length>1){const cs=[...new Set(legs.map(l=>l.comp||l.competitie).filter(Boolean))];comp=cs.length===1?cs[0]:(cs.length?"Mixt":"")}
    }
    const odds=nr(x.odds??x.cota),stake=nr(x.stake??x.miza);
    if(!match)throw new Error("Pariul "+(i+1)+" nu are meci.");
    if(!(odds>=1.01))throw new Error("Pariul "+(i+1)+" nu are cotă validă.");
    if(!(stake>0))throw new Error("Pariul "+(i+1)+" nu are miză.");
    const res=okRes.includes(x.result)?x.result:"pending";
    const date=/^\d{4}-\d{2}-\d{2}$/.test(x.date||x.data||"")?(x.date||x.data):today();
    return {match,date,comp,market:market||"Altul",pick,odds:Math.round(odds*100)/100,stake,book:String(x.book||x.casa||"").trim(),result:res,cashout:res==="cashout"?nr(x.cashout):0,note:String(x.note||x.nota||"").trim()};
  });
}

function normNotes(o){
  const out={};
  Object.entries(o&&typeof o==="object"?o:{}).forEach(([k,v])=>{
    if(!v)return;
    let items=Array.isArray(v.items)?v.items.filter(x=>x&&x.t):(v.t?[{id:"n"+(v.u||Date.now()).toString(36),t:v.t,u:v.u||Date.now()}]:[]);

}

const inClaude=!!(window.claude&&window.claude.use&&!window.claude.__firebase);
function betsCSV(list){
  const q=v=>{v=String(v??"");return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const dec=v=>(Math.round(v*100)/100).toFixed(2).replace(".",",");
  const head=["Data","Meci","Competiție","Tip pariu","Selecție","Cotă","Miză","Rezultat","Cashout","Profit","Casa","Notă"];
  const rows=list.map(b=>[b.date,b.match,b.comp,b.market,b.pick,dec(n(b.odds)),dec(n(b.stake)),RES[b.result]||b.result,b.result==="cashout"?dec(n(b.cashout)):"",b.result==="pending"?"":dec(profit(b)),b.book,b.note].map(q).join(";"));
  return [head.join(";"),...rows].join("\n");
}

      txns=s.docs.map(d=>({id:d.id,...d.data()}));lsSet(LSX,txns);render();
      const ae=document.activeElement;if(!(ae&&ae.closest&&ae.closest("#btxForm")))renderMoney();
    });
    notesRef.onSnapshot(s=>{
      if(!s.exists){if(Object.keys(notes).length)notesRef.set({notes}).catch(()=>{});return}
      if(noteTimer||s.metadata.hasPendingWrites)return;
      notes=normNotes((s.data()||{}).notes);lsSet(LSN,notes);
      const ae=document.activeElement;if(tab==="notes"&&!noteEdit&&!(ae&&(ae.id==="btnText"||ae.id==="btnEditText")))renderNotes();
    });
    let firstSnap=true;
    col.onSnapshot(s=>{
      if(firstSnap){firstSnap=false;const local=lsGet(LSB,[]);
        if(s.empty&&local.length){local.forEach(b=>{const {id,...body}=b;col.doc(id).set(body).catch(()=>{})});return}}
      bets=s.docs.map(d=>({id:d.id,...d.data()}));lsSet(LSB,bets);render();$("btSync").textContent="Sincronizat pe toate dispozitivele tale"},
      ()=>{$("btSync").textContent="Sincronizarea s-a oprit. Reîncarcă pagina."});
    setRef.onSnapshot(s=>{if(!s.exists&&lsGet(LSS,null)){setRef.set({...settings}).catch(()=>{});return}if(s.exists){settings={...settings,...s.data()};lsSet(LSS,settings);render()}});
  }catch(e){$("btSync").textContent="Salvat în acest browser"}
})();
})();
</script>
<script>
/* ---------- meniul din stânga: comută între Activități și Pariuri și între secțiuni ---------- */
(function(){
  const $=id=>document.getElementById(id);
  const clearSearch=()=>{const si=$("searchInput");if(si&&si.value){si.value="";si.dispatchEvent(new Event("input"));si.dispatchEvent(new KeyboardEvent("keydown",{key:"Escape"}))}};
  const act={
    azi:()=>{$("swAct").click();clearSearch();$("tabDay").click();if(!$("todayBtn").disabled)$("todayBtn").click();scrollTo(0,0)},
    recurente:()=>{$("swAct").click();clearSearch();$("tabRec").click();scrollTo(0,0)},
    finalizate:()=>{$("swAct").click();clearSearch();$("tabDone").click();scrollTo(0,0)},
    probleme:()=>{$("swAct").click();clearSearch();$("tabDay").click();$("secIssues").scrollIntoView({behavior:"smooth",block:"start"})},
    observatii:()=>{$("swAct").click();clearSearch();$("tabDay").click();$("secNotes").scrollIntoView({behavior:"smooth",block:"start"})},
    bilete:()=>{$("swBet").click();$("btTabBets").click()},
    statistici:()=>{$("swBet").click();$("btTabStats").click()},
    notite:()=>{$("swBet").click();$("btTabNotes").click()},
    bani:()=>{$("swBet").click();$("btTabMoney").click()}
  };
  document.querySelectorAll(".nav[data-nav]").forEach(b=>b.addEventListener("click",()=>{act[b.dataset.nav]();sync()}));
  function current(){
    if(!$("btApp").hidden){
      if($("btTabStats").getAttribute("aria-selected")==="true")return "statistici";
      if($("btTabNotes").getAttribute("aria-selected")==="true")return "notite";
      if($("btTabMoney").getAttribute("aria-selected")==="true")return "bani";
      return "bilete";
    }
    if($("tabDone").getAttribute("aria-selected")==="true")return "finalizate";
    return $("tabRec").getAttribute("aria-selected")==="true"?"recurente":"azi";
  }
  function sync(){
    const c=current();
    document.querySelectorAll(".nav[data-nav]").forEach(b=>{if(b.dataset.nav===c)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
    const badge=$("swBetBadge"),n=$("nBil");if(n)n.textContent=badge&&!badge.hidden?badge.textContent:"";
    const cur=document.querySelector('.nav[aria-current="page"]');
    if(cur&&matchMedia("(max-width:859px)").matches){const nl=$("navlist");const r=cur.getBoundingClientRect(),nr=nl.getBoundingClientRect();if(r.left<nr.left||r.right>nr.right)nl.scrollBy({left:r.left-nr.left-16})}
  }
  const mo=new MutationObserver(sync);
  ["app","btApp"].forEach(id=>mo.observe($(id),{attributes:true,attributeFilter:["hidden"]}));
  ["tabRec","tabDay","tabDone","btTabBets","btTabStats","btTabNotes","btTabMoney"].forEach(id=>mo.observe($(id),{attributes:true,attributeFilter:["aria-selected"]}));
  mo.observe($("swBetBadge"),{attributes:true,childList:true,characterData:true,subtree:true});
  sync();
})();
</script>
</main>
